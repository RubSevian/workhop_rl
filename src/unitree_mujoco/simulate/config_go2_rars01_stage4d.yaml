robot: "go2_rars01"
robot_scene: "scene_stage4d.xml"
base_body: "base"
domain_id: 1
interface: "lo"
enable_unitree_bridge: 0
enable_ros_bridge: 1
use_joystick: 0
joystick_type: "xbox"
joystick_device: "/dev/input/js0"
joystick_bits: 16
print_scene_information: 1
enable_elastic_band: 0
odom_topic: "/sim/ground_truth_odom"
world_frame: "map"
lidar_rate: 10.0
lidar_horizontal_samples: 360
lidar_vertical_lines: 18
lidar_min_range: 0.5
lidar_max_range: 100.0
# Let MuJoCo settle and the RL standing phase complete before Point-LIO initializes.
sensor_start_delay: 12.0

# Stage4D interactive MuJoCo viewport control. Ctrl+LMB short-click on a
# walkable geom sets/replaces the goal; plain LMB short-click cancels it.
enable_interactive_goal_click: 1
goal_click_drag_threshold_px: 5.0
# M0.1 manual arm-target UI.  This only publishes a world-frame PoseStamped;
# the ROS manipulation state machine owns IK and safe arm motion.
enable_manual_manip_target: 1
enable_mujoco_hud: 1
allow_manual_manip_during_navigation: 0

goal_click_walkable_geoms:
  - floor
