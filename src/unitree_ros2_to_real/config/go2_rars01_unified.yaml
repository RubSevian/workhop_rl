go2_rars01:
  # Strict Phase-2 actor path; ignores the legacy `observations` list.
  observation_layout: "go2_rars01_unified_v1"
  model_name: ""

  observations: []
  observations_history: [4, 3, 2, 1, 0]
  observations_history_priority: "time"

  clip_obs: 100.0
  clip_actions: 100.0
  action_scale: 0.25
  ang_vel_scale: 0.25
  dof_pos_scale: 1.0
  dof_vel_scale: 0.05
